version: '3.8'

services:
  mukhostho-db:
    build: .
    container_name: mukhostho-db
    ports:
      - "8080:8080"
    volumes:
      - mukhostho_data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      - MUKHOSTHO_HOST=0.0.0.0
      - MUKHOSTHO_PORT=8080
      - MUKHOSTHO_DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add a monitoring container
  prometheus:
    image: prom/prometheus:latest
    container_name: mukhostho-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped

  # Optional: Add Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: mukhostho-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  mukhostho_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: mukhostho-network
